# Builds the CUBED installers (Windows, macOS, Linux).
#
# Every push to main builds them, so a broken build shows up straight away.
# Nothing is published by a push.
#
# Publish a release: Actions tab > "Release installers" > "Run workflow".
# The release is named after "version" in package.json (v1.0.0 for 1.0.0).
# Raise that number before publishing the next one. Pushing a tag such as
# v1.0.1 also publishes, with the tag as the version number.
#
# The app's address comes from "cubed.url" in package.json.
name: Release installers

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the installers as a release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Two Mac runners build the same two .dmg files (arm64 and x64).
        # GitHub is often short of Mac machines and a job can wait 15 minutes
        # and give up; with two kinds asked for, one usually gets through.
        os: [windows-latest, macos-15-intel, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # A Mac runner that never arrives must not fail the whole run.
    continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the app address and set the version
        shell: bash
        run: |
          url="$(node -p "require('./package.json').cubed.url")"
          if [ -z "$url" ]; then
            echo "::error::Set cubed.url in package.json to the live address of CUBED."
            exit 1
          fi
          echo "Building for $url"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List installers
        shell: bash
        run: |
          {
            echo "### Installers (${{ matrix.os }})"
            echo
            echo '```'
            for f in dist/*.exe dist/*.dmg dist/*.AppImage; do
              if [ -f "$f" ]; then
                echo "$(( $(wc -c < "$f") / 1048576 )) MB  ${f#dist/}"
              fi
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  release:
    name: Publish release
    needs: build
    # Publish whatever built, even if one platform failed.
    if: ${{ !cancelled() && (github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$(node -p "require('./package.json').version")"
          fi
          ls -la installers
          # Say so clearly when a platform is missing (usually: no Mac runner).
          for want in .exe .dmg .AppImage; do
            if ! ls installers/*"$want" >/dev/null 2>&1; then
              echo "::warning::No $want installer was built. Open this run and choose 'Re-run failed jobs' to add it to the release."
              echo "**Missing: $want installer.** Choose *Re-run failed jobs* on this run to add it." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # The release is already there: refresh its installers.
            gh release upload "$tag" installers/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" installers/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "CUBED ${tag#v}" \
              --notes "Installers for Windows (.exe), macOS (.dmg: arm64 for Apple Silicon, x64 for Intel) and Linux (.AppImage)."
          fi
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
