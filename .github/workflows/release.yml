# Builds the CUBED installers (Windows, macOS, Linux) and publishes them as a
# GitHub Release.
#
# Make a release: push a tag, for example
#   git tag v1.0.1 && git push origin v1.0.1
# The tag sets the app's version number. "Run workflow" on the Actions tab
# builds the installers without publishing a release.
#
# The app's address comes from "cubed.url" in package.json.
name: Release installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the app address and set the version
        shell: bash
        run: |
          url="$(node -p "require('./package.json').cubed.url")"
          if [ -z "$url" ]; then
            echo "::error::Set cubed.url in package.json to the live address of CUBED."
            exit 1
          fi
          echo "Building for $url"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage

  release:
    name: Publish release
    needs: build
    # Publish whatever built, even if one platform failed.
    if: ${{ !cancelled() && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "CUBED ${GITHUB_REF_NAME#v}" \
            --notes "Installers for Windows (.exe), macOS (.dmg: arm64 for Apple Silicon, x64 for Intel) and Linux (.AppImage)."
